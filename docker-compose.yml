services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        FLAVOR: ${FLAVOR}
    container_name: pest_control_frontend
    restart: unless-stopped
    environment:
      API_URL: https://pest_control_backend:${BACKEND_PORT}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${FRONTEND_PORT}:8080"
    volumes:
      - ./cert.pem:/cert.pem:ro
      - ./key.pem:/key.pem:ro
    networks:
      - pest_network
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pest_control_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      FLAVOR: production
      PORT: ${BACKEND_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: pest_control
      DB_USER: pestuser
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SSL_ENABLED: ${SSL_ENABLED}
      USE_HTTPS: ${USE_HTTPS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      CLIENT: drpestcontrol
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
      - ./cert.pem:/cert.pem:ro
      - ./key.pem:/key.pem:ro
      - ./.env.production:/app/.env:ro
    networks:
      - pest_network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: pest_control_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pest_control
      POSTGRES_USER: pestuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./backend/sql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pestuser -d pest_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pest_control_pgadmin
    profiles: ["dev", "tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: 'False'
      PGADMIN_CONFIG_WTF_CSRF_TIME_LIMIT: 'None'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backups:/var/lib/pgadmin/backups:rw
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pest_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pest_network:
    driver: bridge