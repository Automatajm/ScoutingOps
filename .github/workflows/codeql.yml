name: "CodeQL Analysis"

on:
  push:
    branches: [ "starting_on_git", "main", "master" ]
  pull_request:
    branches: [ "starting_on_git", "main", "master" ]
  schedule:
    - cron: '0 12 * * 0'  # Weekly on Sundays at 12:00 PM

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]  # Solo JavaScript por ahora, Dart requiere configuración especial

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Install Dependencies (Node.js)
      run: |
        cd backend
        npm install --only=prod

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  # Análisis separado para Dart usando herramientas específicas
  dart-analysis:
    name: Dart Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter/Dart
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'

    - name: Install Dependencies
      run: |
        cd frontend
        flutter pub get

    - name: Run Dart Analyzer
      run: |
        cd frontend
        dart analyze --fatal-infos

    - name: Run Flutter Security Audit
      run: |
        cd frontend
        flutter pub deps --json | dart pub global run pana