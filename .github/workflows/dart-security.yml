name: "Dart Security Analysis"

on:
  push:
    branches: [ "starting_on_git", "main", "master" ]
  pull_request:
    branches: [ "starting_on_git", "main", "master" ]

jobs:
  dart-security:
    name: Dart Security & Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'  # Versión más reciente
        channel: 'stable'

    - name: Disable Flutter analytics
      run: flutter config --no-analytics

    - name: Debug Environment
      run: |
        echo "🔍 Environment Debug Info:"
        echo "Flutter version:"
        flutter --version
        echo ""
        echo "Dart version:"
        dart --version
        echo ""
        echo "Working directory contents:"
        ls -la
        echo ""
        echo "Frontend directory contents:"
        ls -la frontend/ || echo "Frontend directory not found"
        echo ""
        echo "Pubspec.yaml exists:"
        test -f frontend/pubspec.yaml && echo "✅ Found pubspec.yaml" || echo "❌ pubspec.yaml not found"
        echo ""
        echo "📋 Checking for native dependencies that might cause issues:"
        cd frontend
        echo "Native plugins in pubspec.yaml:"
        grep -E "(connectivity_plus|path_provider|shared_preferences|url_launcher|sqflite)" pubspec.yaml || echo "No problematic native plugins found"

    - name: Get dependencies
      run: |
        cd frontend
        echo "📦 Installing Flutter Web dependencies..."
        echo "⚠️ Note: Ignoring Android embedding warnings for web-only app"
        
        # Force continue even with exit code 1
        set +e  # Don't exit on error
        flutter config --enable-web
        flutter pub get --verbose > pub_get_output.log 2>&1
        exit_code=$?
        set -e  # Re-enable exit on error
        
        echo "📋 Pub get finished with exit code: $exit_code"
        
        # Always check for pubspec.lock as success indicator
        if [ -f "pubspec.lock" ]; then
          echo "✅ Dependencies resolved successfully (pubspec.lock exists)"
          echo "🌐 Web support enabled"
          echo "📊 Total packages: $(grep -c 'name:' pubspec.lock)"
        else
          echo "❌ No pubspec.lock found - dependencies not resolved"
          echo "📋 Last 10 lines of output:"
          tail -10 pub_get_output.log
          exit 1
        fi

    - name: 1. Dart Static Analysis
      run: |
        cd frontend
        echo "🔍 Running Dart static analysis..."
        
        # Run analysis but don't fail on warnings
        dart analyze lib/ --no-fatal-infos --no-fatal-warnings 2>&1 | tee analysis_output.log || true
        
        # Show results
        if grep -q "No issues found" analysis_output.log; then
          echo "✅ No issues found in static analysis"
        else
          echo "⚠️ Analysis completed with findings:"
          cat analysis_output.log | tail -20
        fi

    - name: 2. Security Pattern Check
      run: |
        cd frontend
        echo "🔐 Checking for web security vulnerabilities..."
        
        echo "📋 Searching for hardcoded secrets..."
        grep -r -i "password\s*=\s*['\"]" lib/ --include="*.dart" && echo "❌ Found hardcoded passwords!" || echo "✅ No hardcoded passwords"
        grep -r -i "api[_-]?key\s*=\s*['\"]" lib/ --include="*.dart" && echo "❌ Found hardcoded API keys!" || echo "✅ No hardcoded API keys"
        grep -r -i "secret\s*=\s*['\"]" lib/ --include="*.dart" && echo "❌ Found hardcoded secrets!" || echo "✅ No hardcoded secrets"
        grep -r -i "token\s*=\s*['\"]" lib/ --include="*.dart" && echo "❌ Found hardcoded tokens!" || echo "✅ No hardcoded tokens"
        
        echo "📋 Checking for insecure HTTP usage..."
        grep -r "http://" lib/ --include="*.dart" && echo "❌ Found insecure HTTP URLs!" || echo "✅ No insecure HTTP found"
        
        echo "📋 Checking for debug mode in production..."
        grep -r "kDebugMode.*false" lib/ --include="*.dart" && echo "❌ Debug mode issues found!" || echo "✅ No debug mode issues"
        
        echo "📋 Web-specific security checks..."
        grep -r -i "allowCredentials.*true" lib/ --include="*.dart" && echo "⚠️ Review CORS credentials usage!" || echo "✅ No CORS credential issues"
        grep -r -i "dangerouslyAllowInsecure" lib/ --include="*.dart" && echo "❌ Insecure settings found!" || echo "✅ No insecure settings"
        grep -r "innerHTML\|outerHTML" lib/ --include="*.dart" && echo "⚠️ Direct HTML manipulation found - review for XSS!" || echo "✅ No direct HTML manipulation"

    - name: 3. Web Dependency Security Audit
      run: |
        cd frontend
        echo "📦 Checking web dependencies for vulnerabilities..."
        flutter pub deps --json > deps.json || true
        
        # Web-specific dependency checks
        echo "🌐 Scanning for web-specific security issues..."
        
        # Check for vulnerable web packages
        cat deps.json | grep -i "js.*0.6.7" && echo "⚠️ js package is discontinued - consider alternatives!" || echo "✅ js package status OK"
        cat deps.json | grep -i "connectivity_plus.*5.0.2" && echo "⚠️ connectivity_plus has known issues - update recommended!" || echo "✅ connectivity_plus version OK"
        
        # Check for outdated critical web packages
        flutter pub outdated --json > outdated.json 2>/dev/null || true
        echo "📊 Web dependency analysis complete"
        
        # Count web-relevant packages
        echo "📈 Web packages summary:"
        echo "Total dependencies: $(cat deps.json | grep '"name":' | wc -l)"
        echo "Web-related packages: $(cat deps.json | grep -i 'web\|http\|url\|cors' | wc -l)"

    - name: 4. Code Quality Metrics
      run: |
        cd frontend
        echo "📊 Analyzing code quality metrics..."
        
        # Count potential security issues
        echo "🔢 Counting potential issues:"
        echo "TODO comments: $(grep -r "TODO" lib/ --include="*.dart" | wc -l)"
        echo "FIXME comments: $(grep -r "FIXME" lib/ --include="*.dart" | wc -l)"
        echo "Hardcoded strings: $(grep -r "String.*=.*['\"]http" lib/ --include="*.dart" | wc -l)"
        
        # Check for proper error handling
        echo "🛡️ Error handling check:"
        echo "Try-catch blocks: $(grep -r "try\s*{" lib/ --include="*.dart" | wc -l)"
        echo "Error classes: $(grep -r "class.*Error\|class.*Exception" lib/ --include="*.dart" | wc -l)"

    - name: 5. Generate Security Report
      run: |
        cd frontend
        echo "📋 Generating security summary..."
        echo "# Dart Security Analysis Report" > security_report.md
        echo "Generated on: $(date)" >> security_report.md
        echo "" >> security_report.md
        echo "## Dart Files Analyzed: $(find lib/ -name "*.dart" | wc -l)" >> security_report.md
        echo "## Lines of Code: $(find lib/ -name "*.dart" -exec cat {} \; | wc -l)" >> security_report.md
        echo "" >> security_report.md
        echo "## Key Findings:" >> security_report.md
        echo "- Static analysis completed" >> security_report.md
        echo "- Security patterns checked" >> security_report.md
        echo "- Dependencies audited" >> security_report.md
        echo "" >> security_report.md
        cat security_report.md

    - name: 6. Upload Security Report
      uses: actions/upload-artifact@v4
      with:
        name: dart-security-report
        path: frontend/security_report.md