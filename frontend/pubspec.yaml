# ===== PUBSPEC.YAML CORREGIDO =====
# REMOVER mobile_scanner que está causando conflicto

name: pestcontrol
description: App web para control de plagas - Costa Analytics (Móvil + PC)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # ===== CONFIGURACIÓN DE ENTORNO =====
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  
  # ===== GESTIÓN DE ESTADO =====
  provider: ^6.1.2
  flutter_bloc: ^8.1.3
  
  # ===== NETWORKING =====
  dio: ^5.4.1
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  
  # ===== WEB ESPECÍFICO =====
  universal_html: ^2.2.4
  js: ^0.6.7
  flutter_web_plugins:
    sdk: flutter
  
  # ===== UTILIDADES CORE =====
  intl: ^0.19.0
  equatable: ^2.0.5
  either_dart: ^1.0.0
  dartz: ^0.10.1
  
  # ===== ALMACENAMIENTO WEB =====
  flutter_secure_storage: ^9.0.0
  
  # ===== UI RESPONSIVO =====
  cupertino_icons: ^1.0.2
  fl_chart: ^0.67.0
  hovering: ^1.0.4
  
  # ===== NAVEGACIÓN =====
  go_router: ^13.2.0
  url_launcher: ^6.2.2
  
  # ===== ARCHIVOS =====
  excel: ^4.0.6
  file_picker: ^6.1.1
  
  # ===== ESCÁNER: REMOVER mobile_scanner =====
  # mobile_scanner: ^3.5.6  # ❌ COMENTADO - CAUSA CONFLICTO
  
  # ===== UTILIDADES =====
  logging: ^1.2.0
  crypto: ^3.0.3
  sprintf: ^7.0.0
  form_validator: ^2.1.1
  json_annotation: ^4.8.1
  retry: ^3.1.2
  
  # ===== UI/UX =====
  flutter_animate: ^4.2.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0
  
  # ===== DEVICE INFO =====
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0
  responsive_framework: ^1.1.1
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
    - .env.development
    - .env.staging
    - .env.production