<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ===== CONSOLE OVERRIDE AUTOMÁTICO ===== -->
  <script>
    (function() {
      'use strict';

      const detectEnvironment = () => {
        const flavorMeta = document.querySelector('meta[name="dart-flavor"]')?.content;
        const localOverride = localStorage.getItem('FORCE_ENV_MODE');
        
        if (localOverride) {
          console.warn(`🔧 ENV OVERRIDE ACTIVO: ${localOverride}`);
          return {
            isProduction: localOverride === 'production',
            isStaging: localOverride === 'staging',
            isDevelopment: localOverride === 'development',
            source: 'localStorage_override'
          };
        }
        
        const hostname = window.location.hostname;
        const protocol = window.location.protocol;
        
        const isProductionByUrl = (
          protocol === 'https:' &&
          hostname !== 'localhost' &&
          hostname !== '127.0.0.1' &&
          !hostname.includes('192.168') &&
          !hostname.includes('10.0.0') &&
          !hostname.includes('ngrok') &&
          !hostname.includes('test') &&
          !hostname.includes('staging')
        );
        
        const isStagingByUrl = (hostname.includes('staging') || hostname.includes('test'));
        
        const isProduction = flavorMeta === 'production' || isProductionByUrl;
        const isStaging = flavorMeta === 'staging' || (isStagingByUrl && !isProduction);
        const isDevelopment = !isProduction && !isStaging;
        
        return {
          isProduction, isStaging, isDevelopment,
          source: flavorMeta ? 'meta_tag' : 'url_detection',
          flavorMeta, hostname, protocol
        };
      };

      const env = detectEnvironment();
      window.__ENV__ = env;
      
      const originalConsole = {
        log: console.log, info: console.info, warn: console.warn,
        error: console.error, debug: console.debug, trace: console.trace,
        group: console.group, groupCollapsed: console.groupCollapsed,
        groupEnd: console.groupEnd, table: console.table, dir: console.dir
      };
      
      window.__originalConsole = originalConsole;
      
      const generateRef = () => `REF-${Date.now()}${Math.random().toString(36).substr(2, 5)}`;
      
      const sanitizeMessage = (message) => {
        if (typeof message !== 'string') return '[DATA]';
        return message
          .replace(/usuario[:\s]+[\w\-]+/gi, 'usuario: [HIDDEN]')
          .replace(/password[:\s]+[\w\-]+/gi, 'password: [HIDDEN]')
          .replace(/token[:\s]+[\w\.\-]+/gi, 'token: [HIDDEN]')
          .replace(/bearer\s+[\w\.\-]+/gi, 'bearer [HIDDEN]')
          .replace(/lote[:\s]+[\w\-]+/gi, 'lote: [HIDDEN]')
          .replace(/codigo[:\s]+[\w\-]+/gi, 'codigo: [HIDDEN]')
          .replace(/\b\d{6,12}\b/g, '[CODE]')
          .replace(/ip[:\s]+[\d\.]+/gi, 'ip: [HIDDEN]')
          .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, '[IP]');
      };
      
      const getEnvLabel = () => {
        if (env.isProduction) return 'PROD';
        if (env.isStaging) return 'STAG';
        const hostname = window.location.hostname;
        if (hostname === 'localhost' || hostname === '127.0.0.1') return 'LOCAL';
        if (hostname.includes('192.168')) return 'LAN';
        if (hostname.includes('10.0.0')) return 'WIFI';
        if (hostname.includes('ngrok')) return 'NGROK';
        return 'DEV';
      };
      
      // Console override por entorno
      if (env.isProduction) {
        console.log = console.info = console.debug = console.trace = 
        console.group = console.groupCollapsed = console.groupEnd = 
        console.table = console.dir = function() {};
        
        console.warn = function() {
          originalConsole.warn(`⚠️ ${generateRef()}`);
        };
        
        console.error = function(message, ...args) {
          const ref = generateRef();
          const messageStr = String(message || '');
          
          const isFrameworkError = messageStr.includes('Flutter') || 
            messageStr.includes('dart:') || messageStr.includes('framework');
          
          if (isFrameworkError) {
            originalConsole.error(`❌ FRAMEWORK: ${sanitizeMessage(messageStr).substring(0, 100)}`);
          } else {
            originalConsole.error(`❌ ERROR: ${ref}`);
          }
        };
        
      } else if (env.isStaging) {
        console.log = console.debug = function() {};
        
        console.info = function(message, ...args) {
          originalConsole.info(`ℹ️ [STAG]`, sanitizeMessage(String(message || '')), ...args.slice(0, 2));
        };
        
        console.warn = function(message, ...args) {
          originalConsole.warn(`⚠️ [STAG]`, message, ...args);
        };
        
        console.error = function(message, ...args) {
          originalConsole.error(`❌ [STAG]`, message, ...args);
        };
        
        console.table = function(data) {
          originalConsole.table(data);
        };
        
      } else {
        // Development: logs completos
        const envLabel = getEnvLabel();
        
        console.log = function(message, ...args) {
          originalConsole.log(`🐛 [${envLabel}]`, message, ...args);
        };
        
        console.info = function(message, ...args) {
          originalConsole.info(`ℹ️ [${envLabel}]`, message, ...args);
        };
        
        console.warn = function(message, ...args) {
          originalConsole.warn(`⚠️ [${envLabel}]`, message, ...args);
        };
        
        console.error = function(message, ...args) {
          originalConsole.error(`❌ [${envLabel}]`, message, ...args);
        };
        
        console.debug = function(message, ...args) {
          originalConsole.debug(`🔍 [${envLabel}]`, message, ...args);
        };
      }
      
      // Logger global
      window.Logger = {
        critical: function(message, data = null) {
          const ref = generateRef();
          if (env.isProduction) {
            originalConsole.error(`🚨 CRITICAL: ${ref}`);
          } else {
            originalConsole.error(`🚨 CRITICAL: ${message} [${ref}]`, data);
          }
        },
        
        security: function(message, data = null) {
          const ref = generateRef();
          if (env.isProduction) {
            originalConsole.error(`🔒 SECURITY: ${ref}`);
          } else {
            originalConsole.error(`🔒 SECURITY: ${message} [${ref}]`, data);
          }
        },
        
        performance: function(message, data = null) {
          if (!env.isProduction) {
            originalConsole.warn(`⚡ PERFORMANCE: ${message}`, data);
          }
        },

        network: function(message, data = null) {
          if (env.isDevelopment) {
            originalConsole.info(`🌐 NETWORK: ${message}`, data);
          }
        },

        scanner: function(message, data = null) {
          if (env.isDevelopment) {
            originalConsole.info(`📷 SCANNER: ${message}`, data);
          }
        },
        
        dev: function(message, ...args) {
          if (env.isDevelopment) {
            originalConsole.log(`💻 DEV:`, message, ...args);
          }
        }
      };
      
      // Funciones de debug (solo en development)
      if (env.isDevelopment) {
        window.restoreConsole = () => {
          Object.assign(console, originalConsole);
          console.warn('🔓 Console original restaurada');
        };
        
        window.showEnvConfig = () => {
          originalConsole.table(env);
          return env;
        };
        
        window.forceEnvMode = (mode) => {
          if (['production', 'staging', 'development'].includes(mode)) {
            localStorage.setItem('FORCE_ENV_MODE', mode);
            originalConsole.warn(`🔧 Forzando modo: ${mode} - Recarga para aplicar`);
          } else {
            originalConsole.error('❌ Modo inválido. Usa: production, staging, development');
          }
        };
        
        window.clearForceEnvMode = () => {
          localStorage.removeItem('FORCE_ENV_MODE');
          originalConsole.warn('🔧 Forzado eliminado - Recarga para aplicar');
        };
      }
      
      // Log de inicialización
      if (!env.isProduction) {
        const envInfo = {
          '🌍 Environment': env.isProduction ? 'PRODUCTION' : env.isStaging ? 'STAGING' : 'DEVELOPMENT',
          '📍 Hostname': window.location.hostname,
          '🔒 Protocol': window.location.protocol,
          '🏷️ Flavor Meta': env.flavorMeta || 'none',
          '📊 Detection': env.source,
          '🚦 Console Mode': env.isProduction ? 'BLOCKED' : env.isStaging ? 'FILTERED' : 'FULL'
        };
        
        originalConsole.log('%c🚀 Console Override 2.0 Activado', 'color: #0175C2; font-weight: bold; font-size: 14px');
        originalConsole.table(envInfo);
        
        if (env.isDevelopment) {
          originalConsole.log('%c💡 Funciones disponibles:', 'color: #4CAF50; font-weight: bold');
          originalConsole.log('   • showEnvConfig() - Ver configuración');
          originalConsole.log('   • restoreConsole() - Restaurar console');
          originalConsole.log('   • forceEnvMode("mode") - Forzar modo');
        }
      }
      
    })();
  </script>

  <!-- ===== RESET DE EMERGENCIA ===== -->
  <script>
    window.emergencyReset = async function() {
      try {
        console.log('🔄 Reset de emergencia...');
        
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
          console.log('✅ Service Workers limpiados');
        }
        
        if ('caches' in window) {
          const names = await caches.keys();
          for (const name of names) await caches.delete(name);
          console.log('✅ Caches limpiados');
        }
        
        if (indexedDB.databases) {
          const dbs = await indexedDB.databases();
          for (const db of dbs) {
            if (db.name) indexedDB.deleteDatabase(db.name);
          }
          console.log('✅ IndexedDB limpiado');
        }
        
        localStorage.clear();
        sessionStorage.clear();
        console.log('✅ Storage limpiado');
        
        console.log('🎉 Reset completo. Recargando...');
        setTimeout(() => {
          window.location.href = window.location.origin + '?reset=' + Date.now();
        }, 1000);
        
        return true;
      } catch (e) {
        console.error('❌ Error en reset:', e);
        window.location.reload();
        return false;
      }
    };
    
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'R') {
        e.preventDefault();
        if (confirm('¿Reset de emergencia?\n\n⚠️ Se perderán datos no sincronizados')) {
          window.emergencyReset();
        }
      }
    });
    
    console.log('ℹ️ Reset emergencia: Ctrl+Shift+R');
  </script>

  <!-- ===== REMOVER LOADING - AGRESIVO Y CONFIABLE ===== -->
  <script>
    (function() {
      'use strict';
      
      let removed = false;
      
      window.forceRemoveLoading = function() {
        if (removed) return;
        const el = document.getElementById('loading');
        if (!el) return;
        
        console.log('✅ Removiendo overlay loading');
        el.classList.add('hide');
        setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
        removed = true;
      };
      
      // Método 1: Flutter first frame
      window.addEventListener('flutter-first-frame', function() {
        console.log('🎯 Flutter first frame detectado');
        window.forceRemoveLoading();
      });
      
      // Método 2: Detectar flt-glass-pane (polling cada 100ms)
      let checks = 0;
      const checkInterval = setInterval(function() {
        const flutterView = document.querySelector('flt-glass-pane');
        if (flutterView || ++checks > 15) {
          if (flutterView) {
            console.log('🎯 Flutter view detectado');
          } else {
            console.log('⏰ Timeout de polling (1.5s)');
          }
          clearInterval(checkInterval);
          window.forceRemoveLoading();
        }
      }, 100);
      
      // Método 3: Timeout agresivo (1.5 segundos)
      setTimeout(function() {
        console.log('⏰ Timeout principal alcanzado');
        clearInterval(checkInterval);
        window.forceRemoveLoading();
      }, 1500);
      
      // Método 4: MutationObserver
      if (typeof MutationObserver !== 'undefined') {
        const observer = new MutationObserver(function(mutations) {
          for (const mutation of mutations) {
            if (mutation.addedNodes.length > 0) {
              const flutterView = document.querySelector('flt-glass-pane');
              if (flutterView) {
                console.log('🎯 Flutter view detectado (MutationObserver)');
                observer.disconnect();
                window.forceRemoveLoading();
                break;
              }
            }
          }
        });
        
        observer.observe(document.body, { childList: true, subtree: true });
        
        // Desconectar después de 2 segundos
        setTimeout(() => observer.disconnect(), 2000);
      }
      
      // Método 5: DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          console.log('🎯 DOMContentLoaded');
          setTimeout(window.forceRemoveLoading, 800);
        });
      }
      
      // Método 6: window.load
      window.addEventListener('load', function() {
        console.log('🎯 Window loaded');
        setTimeout(window.forceRemoveLoading, 500);
      });
      
    })();
  </script>
