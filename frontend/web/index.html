<script>
  // Reset de Emergencia - Limpia SW, Cache, IndexedDB, Storage
  window.emergencyReset = async function() {
    try {
      console.log('🔄 Iniciando reset de emergencia...');
      
      // 1. Service Workers
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) await reg.unregister();
        console.log('✅ Service Workers desregistrados:', regs.length);
      }
      
      // 2. Caches
      if ('caches' in window) {
        const names = await caches.keys();
        for (const name of names) await caches.delete(name);
        console.log('✅ Caches eliminados:', names.length);
      }
      
      // 3. IndexedDB
      if (indexedDB.databases) {
        const dbs = await indexedDB.databases();
        for (const db of dbs) {
          if (db.name) indexedDB.deleteDatabase(db.name);
        }
        console.log('✅ IndexedDB eliminadas:', dbs.length);
      }
      
      // 4. Storage
      localStorage.clear();
      sessionStorage.clear();
      console.log('✅ Storage limpiado');
      
      // 5. Recargar
      console.log('🎉 Reset completo. Recargando...');
      setTimeout(() => {
        window.location.href = window.location.origin + '?reset=' + Date.now();
      }, 1000);
      
      return true;
    } catch (e) {
      console.error('❌ Error:', e);
      window.location.reload();
      return false;
    }
  };
  
  // Atajo: Ctrl+Shift+R
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'R') {
      e.preventDefault();
      if (confirm('¿Ejecutar reset de emergencia?\n\n⚠️ Se perderán los datos no sincronizados.')) {
        window.emergencyReset();
      }
    }
  });
  
  console.log('ℹ️ Reset de emergencia: Ctrl+Shift+R');
</script>

  <!-- ===== OVERRIDE GLOBAL DE CONSOLE INTELIGENTE ===== -->
  <script>
    (function() {
      'use strict';



// ===== DETECCIÓN DE ENTORNO =====
      const isProduction = (
        (window.location.hostname !== 'localhost' && 
         window.location.hostname !== '127.0.0.1' &&
         !window.location.hostname.includes('192.168') &&
         !window.location.hostname.includes('10.0.0') &&
         window.location.protocol === 'https:') ||
        (document.querySelector('meta[name="dart-flavor"]')?.content === 'production')
      );

     /*
       // ===== DETECCIÓN DE ENTORNO =====
      const isProduction = false; // ✅ FORZAR DESARROLLO
      const ORIGINAL_isProduction = (
        (window.location.hostname !== 'localhost' && 
        window.location.hostname !== '127.0.0.1' &&
         !window.location.hostname.includes('192.168') &&
         !window.location.hostname.includes('10.0.0') &&
         window.location.protocol === 'https:') ||
        (document.querySelector('meta[name="dart-flavor"]')?.content === 'production')
      );
      */
      const isStaging = window.location.hostname.includes('staging') ||
                       window.location.hostname.includes('test') ||
                       (document.querySelector('meta[name="dart-flavor"]')?.content === 'staging');
      
      const isDevelopment = !isProduction && !isStaging;
      
      // Guardar consoles originales
      const originalConsole = {
        log: console.log,
        info: console.info,
        warn: console.warn,
        error: console.error,
        debug: console.debug,
        trace: console.trace,
        group: console.group,
        groupCollapsed: console.groupCollapsed,
        groupEnd: console.groupEnd
      };
      
      // Función para generar referencia
      const generateRef = () => `REF-${Date.now()}`;
      
      // Función para limpiar datos sensibles
      const sanitizeMessage = (message) => {
        if (typeof message !== 'string') return '[SANITIZED]';
        
        return message
          .replace(/usuario[:\s]+[\w\-]+/gi, 'usuario: [HIDDEN]')
          .replace(/password[:\s]+[\w\-]+/gi, 'password: [HIDDEN]')
          .replace(/token[:\s]+[\w\.\-]+/gi, 'token: [HIDDEN]')
          .replace(/lote[:\s]+[\w\-]+/gi, 'lote: [HIDDEN]')
          .replace(/codigo[:\s]+[\w\-]+/gi, 'codigo: [HIDDEN]')
          .replace(/\b\d{6,12}\b/g, '[CODE]')
          .replace(/ip[:\s]+[\d\.]+/gi, 'ip: [HIDDEN]');
      };
      
      if (isProduction) {
        // 🚫 PRODUCCIÓN: Silencio total excepto errores críticos
        console.log = function() {};
        console.info = function() {};
        console.debug = function() {};
        console.trace = function() {};
        console.group = function() {};
        console.groupCollapsed = function() {};
        console.groupEnd = function() {};
        
        console.warn = function(message, ...args) {
          // Solo warnings críticos con referencia
          const ref = generateRef();
          originalConsole.warn(`⚠️ WARNING: ${ref}`);
        };
        
        console.error = function(message, ...args) {
          const ref = generateRef();
          const messageStr = String(message || '');
          
          // Detectar errores de framework vs errores de app
          const isFrameworkError = messageStr.includes('Flutter') || 
                                  messageStr.includes('dart:') ||
                                  messageStr.includes('framework') ||
                                  messageStr.includes('rendering') ||
                                  messageStr.includes('DioException') ||
                                  messageStr.includes('RenderFlex');
          
          const isSecurityError = messageStr.toLowerCase().includes('security') ||
                                 messageStr.toLowerCase().includes('unauthorized') ||
                                 messageStr.toLowerCase().includes('forbidden');
          
          if (isFrameworkError) {
            // Errores de framework: mostrar pero limpiar datos sensibles
            const cleanMessage = sanitizeMessage(messageStr);
            originalConsole.error(`❌ FRAMEWORK: ${cleanMessage}`);
          } else if (isSecurityError) {
            // Errores de seguridad: solo referencia
            originalConsole.error(`🔒 SECURITY: ${ref}`);
          } else {
            // Errores de app: solo referencia
            originalConsole.error(`❌ APP ERROR: ${ref}`);
          }
        };
        
      } else if (isStaging) {
        // ⚠️ STAGING: Nivel intermedio
        console.log = function() {}; // Silencio logs normales
        console.debug = function() {}; // Silencio debug
        
        console.info = function(message, ...args) {
          const cleanMessage = sanitizeMessage(String(message || ''));
          originalConsole.info(`ℹ️ [STAGING]`, cleanMessage, ...args);
        };
        
        console.warn = function(message, ...args) {
          originalConsole.warn(`⚠️ [STAGING]`, message, ...args);
        };
        
        console.error = function(message, ...args) {
          originalConsole.error(`❌ [STAGING]`, message, ...args);
        };
        
      } else {
        // 🐛 DEVELOPMENT: Logs normales con prefijos ambientales
        const env = window.location.hostname === 'localhost' ? 'LOCAL' : 
                   window.location.hostname.includes('192.168') ? 'LAN' : 
                   window.location.hostname.includes('10.0.0') ? 'WIFI' :
                   window.location.hostname.includes('ngrok') ? 'NGROK' : 'DEV';
        
        console.log = function(message, ...args) {
          originalConsole.log(`🐛 [${env}]`, message, ...args);
        };
        
        console.info = function(message, ...args) {
          originalConsole.info(`ℹ️ [${env}]`, message, ...args);
        };
        
        console.warn = function(message, ...args) {
          originalConsole.warn(`⚠️ [${env}]`, message, ...args);
        };
        
        console.error = function(message, ...args) {
          originalConsole.error(`❌ [${env}]`, message, ...args);
        };
        
        console.debug = function(message, ...args) {
          originalConsole.debug(`🔍 [${env}]`, message, ...args);
        };
      }
      
      // ===== LOGGER GLOBAL PARA CASOS CRÍTICOS =====
      window.Logger = {
        critical: function(message, data = null) {
          const ref = generateRef();
          if (isProduction) {
            originalConsole.error(`🚨 CRITICAL: ${ref}`);
          } else {
            originalConsole.error(`🚨 CRITICAL: ${message} [${ref}]`, data);
          }
        },
        
        security: function(message, data = null) {
          const ref = generateRef();
          if (isProduction) {
            originalConsole.error(`🔒 SECURITY: ${ref}`);
          } else {
            originalConsole.error(`🔒 SECURITY: ${message} [${ref}]`, data);
          }
        },
        
        performance: function(message, data = null) {
          if (!isProduction) {
            originalConsole.warn(`⚡ PERFORMANCE: ${message}`, data);
          }
        },

        network: function(message, data = null) {
          if (isDevelopment) {
            originalConsole.info(`🌐 NETWORK: ${message}`, data);
          }
        },

        scanner: function(message, data = null) {
          if (isDevelopment) {
            originalConsole.info(`📷 SCANNER: ${message}`, data);
          }
        }
      };
      
      // Info de inicialización
      if (!isProduction) {
        const envInfo = {
          environment: isProduction ? 'PRODUCTION' : isStaging ? 'STAGING' : 'DEVELOPMENT',
          hostname: window.location.hostname,
          protocol: window.location.protocol,
          isSecure: window.location.protocol === 'https:',
          flavorMeta: document.querySelector('meta[name="dart-flavor"]')?.content || 'none'
        };
        
        originalConsole.log(`🚀 Console Override activo`, envInfo);
      }
      
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js"></script>
  
  <!-- ===== SCRIPT PRINCIPAL ===== -->
  <script>
    console.log('🚀 === INICIANDO PEST CONTROL ===');
    
    // ===== VARIABLES GLOBALES =====
    let deferredPrompt;
    let installButton = null;
    let barcodeScanner = {
      isActive: false,
      videoStream: null,
      overlay: null,
      callback: null,
      worker: null,
      isProcessing: false,
      capturedImage: null
    };

    // ===== UTILIDADES =====
    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (window.innerWidth <= 768 && 'ontouchstart' in window);
    }

    function isPWAInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    }

    // ===== PWA INSTALL LOGIC =====
    window.addEventListener('beforeinstallprompt', (e) => {
      if (!isMobileDevice() || isPWAInstalled()) return;
      e.preventDefault();
      deferredPrompt = e;
      showInstallButton();
    });

    function showInstallButton() {
      if (!isMobileDevice() || isPWAInstalled() || installButton) return;

      installButton = document.createElement('button');
      installButton.innerHTML = '📱';
      installButton.title = 'Instalar App';
      installButton.className = 'pwa-install-btn';

      installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          Logger.network('PWA install outcome', outcome);
          deferredPrompt = null;
          hideInstallButton();
        }
      });

      document.body.appendChild(installButton);
      setTimeout(() => {
        if (installButton && !isPWAInstalled()) hideInstallButton();
      }, 30000);
    }

    function hideInstallButton() {
      if (installButton && installButton.parentNode) {
        installButton.style.opacity = '0';
        setTimeout(() => {
          if (installButton && installButton.parentNode) {
            document.body.removeChild(installButton);
          }
          installButton = null;
        }, 300);
      }
    }

    // ===== CONNECTIVITY STATUS =====
    function updateOnlineStatus() {
      window.flutterConnectivityStatus = navigator.onLine ? "online" : "offline";
      Logger.network('Connection status', window.flutterConnectivityStatus);
      
      if (window.flutter_connectivity_update) {
        window.flutter_connectivity_update(window.flutterConnectivityStatus);
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // ===== BARCODE SCANNER FUNCTIONS =====
    
    window.setBarcodeCallback = function(callback) {
      Logger.scanner('Flutter callback registrado');
      barcodeScanner.callback = callback;
    };

    window.startWebBarcodeScanner = function() {
      Logger.scanner('Iniciando escáner OCR...');
      
      if (barcodeScanner.isActive) {
        Logger.scanner('Escáner ya activo, cerrando anterior...');
        cleanupBarcodeScanner();
      }

      createScannerUI();
      startCamera();
    };

    function createScannerUI() {
      barcodeScanner.overlay = document.createElement('div');
      barcodeScanner.overlay.className = 'modal-overlay';
      
      barcodeScanner.overlay.innerHTML = `
        <div style="
          background: white;
          border-radius: 16px;
          padding: 20px;
          max-width: 500px;
          width: 100%;
          max-height: 90vh;
          overflow-y: auto;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
          margin: auto;
        ">
          <!-- Header -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; color: #333; font-size: 18px;">📷 Escáner de Códigos</h3>
            <button onclick="cleanupBarcodeScanner()" style="
              background: #f44336;
              color: white;
              border: none;
              border-radius: 50%;
              width: 32px;
              height: 32px;
              cursor: pointer;
              font-size: 16px;
              display: flex;
              align-items: center;
              justify-content: center;
            ">✕</button>
          </div>
          
          <!-- Video container -->
          <div style="position: relative; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px;">
            <video id="scannerVideo" style="width: 100%; height: 300px; object-fit: cover; border-radius: 12px;"></video>
            
            <!-- Guía de escaneo -->
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                        width: 80%; height: 100px; border: 3px solid #4CAF50; border-radius: 8px;
                        display: flex; align-items: center; justify-content: center;">
              <span style="background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px;">
                Posicione la etiqueta aquí
              </span>
            </div>
            
            <!-- Estado -->
            <div id="scannerStatus" style="position: absolute; top: 10px; left: 10px; right: 10px;
                                          background: rgba(0,0,0,0.8); color: white; padding: 8px 12px; 
                                          border-radius: 15px; text-align: center; font-size: 14px;">
              🔍 Iniciando cámara...
            </div>
            
            <!-- Flash para indicar captura -->
            <div id="captureFlash" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                                         background: white; opacity: 0; pointer-events: none;
                                         border-radius: 12px; transition: opacity 0.1s;"></div>
          </div>
          
          <!-- Controles -->
          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px;">
            <button onclick="captureAndProcess()" id="captureBtn" class="scanner-button btn-success">
              📸 Capturar y Leer
            </button>
            <button onclick="showManualEntry()" class="scanner-button btn-secondary">
              ⌨️ Entrada Manual
            </button>
            <button onclick="cleanupBarcodeScanner()" class="scanner-button btn-secondary">
              ❌ Cancelar
            </button>
          </div>
          
          <!-- Resultado detectado -->
          <div id="detectedResult" style="margin-bottom: 15px; text-align: center;"></div>
          
          <!-- Info -->
          <div style="padding: 15px; background: #e3f2fd; border-radius: 12px; text-align: center;">
            <small style="color: #1976d2; line-height: 1.4;">
              💡 <strong>Paso 1:</strong> Posicione la etiqueta en el marco verde<br>
              📸 <strong>Paso 2:</strong> Presione "Capturar y Leer"<br>
              🎯 <strong>Paso 3:</strong> El sistema procesará automáticamente
            </small>
          </div>
        </div>
      `;
      
      document.body.appendChild(barcodeScanner.overlay);
      barcodeScanner.isActive = true;
    }

    async function startCamera() {
      try {
        updateStatus('📷 Solicitando acceso a cámara...');
        
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        
        barcodeScanner.videoStream = stream;
        const video = document.getElementById('scannerVideo');
        
        if (video) {
          video.srcObject = stream;
          await video.play();
          updateStatus('✅ Cámara lista - Presione "Capturar y Leer"');
          Logger.scanner('Cámara iniciada correctamente');
        }
        
      } catch (error) {
        Logger.critical('Error acceso cámara', error.message);
        updateStatus('❌ Error: No se pudo acceder a la cámara');
        setTimeout(() => {
          showManualEntry();
        }, 2000);
      }
    }

    async function captureAndProcess() {
      if (barcodeScanner.isProcessing) {
        return;
      }
      
      const video = document.getElementById('scannerVideo');
      if (!video || video.videoWidth === 0) {
        updateStatus('❌ Cámara no disponible');
        return;
      }
      
      const captureBtn = document.getElementById('captureBtn');
      if (captureBtn) {
        captureBtn.disabled = true;
        captureBtn.textContent = '⏳ Procesando...';
      }
      
      barcodeScanner.isProcessing = true;
      
      try {
        updateStatus('📸 Capturando imagen...');
        
        // Efecto flash
        const flash = document.getElementById('captureFlash');
        if (flash) {
          flash.style.opacity = '0.8';
          setTimeout(() => {
            flash.style.opacity = '0';
          }, 150);
        }
        
        // Capturar imagen
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        barcodeScanner.capturedImage = canvas;
        Logger.scanner('Imagen capturada');
        
        updateStatus('🤖 Analizando imagen con OCR...');
        
        // Procesar con Tesseract
        const result = await Tesseract.recognize(canvas, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              updateStatus(`🔍 Procesando: ${Math.round(m.progress * 100)}%`);
            }
          }
        });
        
        Logger.scanner('Texto OCR detectado', result.data.text);
        
        // Extraer número útil
        const finalNumber = extractUsefulNumber(result.data.text);
        
        if (finalNumber) {
          Logger.scanner('Número útil extraído', finalNumber);
          showDetectedResult(finalNumber);
        } else {
          updateStatus('⚠️ No se detectó un código válido');
          showRetryOptions();
        }
        
      } catch (error) {
        Logger.critical('Error en procesamiento OCR', error.message);
        updateStatus('❌ Error en análisis');
        showRetryOptions();
      } finally {
        if (captureBtn) {
          captureBtn.disabled = false;
          captureBtn.textContent = '📸 Capturar y Leer';
        }
        barcodeScanner.isProcessing = false;
      }
    }

    function extractUsefulNumber(text) {
      Logger.scanner('Analizando texto', text);
      
      const patterns = [
        /L\s*(\d{9})/gi,
        /(\d{9})/g,
        /[^\d](\d{6,12})[^\d]/g,
        /^(\d{6,12})$/gm,
      ];
      
      for (const pattern of patterns) {
        let match;
        while ((match = pattern.exec(text)) !== null) {
          const number = match[1] || match[0];
          const cleaned = number.replace(/\D/g, '');
          
          if (cleaned.length >= 6 && cleaned.length <= 12) {
            const usefulNumber = cleaned.replace(/^0+/, '') || '0';
            
            if (isValidLoteNumber(usefulNumber)) {
              Logger.scanner('Número procesado', `${cleaned} → ${usefulNumber}`);
              return usefulNumber;
            }
          }
        }
      }
      
      return null;
    }

    function isValidLoteNumber(number) {
      const invalidPatterns = [
        /^(123|111|000|999)+$/,
        /^12345/,
        /^(\d)\1{4,}$/,
      ];
      
      return !invalidPatterns.some(pattern => pattern.test(number)) && number.length >= 3;
    }

    };

    // ===== NETWORK BRIDGE CORREGIDO PARA MIXED CONTENT ===== 
    window.pestControlNetworkBridge = {
      detectedConfig: null,
      isDetecting: false,
      
      async detectLocalIPs() {
        return new Promise((resolve) => {
          const ips = [];
          const rtc = new RTCPeerConnection({ iceServers: [] });
          
          rtc.createDataChannel('');
          rtc.createOffer().then(offer => rtc.setLocalDescription(offer));
          
          rtc.onicecandidate = (event) => {
            if (event.candidate) {
              const candidate = event.candidate.candidate;
              const match = candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
              if (match && !ips.includes(match[1]) && !match[1].startsWith('127.')) {
                ips.push(match[1]);
              }
            }
          };
          
          setTimeout(() => {
            rtc.close();
            resolve(ips);
          }, 2000);
        });
      },

      async testConnection(url) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 5000);
          
          const response = await fetch(`${url}/api/health`, {
            method: 'GET',
            signal: controller.signal,
            headers: { 
              'Accept': 'application/json',
              'ngrok-skip-browser-warning': 'true'
            }
          });
          
          clearTimeout(timeoutId);
          
          if (response.ok) {
            const data = await response.json();
            return { success: true, url, data };
          }
          return { success: false, url, error: 'Invalid response' };
        } catch (error) {
          return { success: false, url, error: error.message };
        }
      },

      async detectConfiguration() {
        if (this.isDetecting) return this.detectedConfig;
        
        this.isDetecting = true;
        Logger.network('Iniciando detección de red...');
        
        try {
          const ips = await this.detectLocalIPs();
          Logger.network('IPs detectadas', ips);
          
          const ports = [8000, 3000, 8080, 5000];
          
          // 🔧 ARREGLO MIXED CONTENT: Solo usar HTTPS si la página está en HTTPS
          const currentProtocol = window.location.protocol;
          const protocols = currentProtocol === 'https:' ? ['https'] : ['https', 'http'];
          
          Logger.network('Protocolo actual', currentProtocol);
          Logger.network('Protocolos a probar', protocols);
          
          const testUrls = [];
          
          // URLs con IPs detectadas
          for (const ip of ips) {
            for (const port of ports) {
              for (const protocol of protocols) {
                testUrls.push(`${protocol}://${ip}:${port}`);
              }
            }
          }
          
          // URLs localhost
          for (const port of ports) {
            for (const protocol of protocols) {
              testUrls.push(`${protocol}://localhost:${port}`);
            }
          }
          
          Logger.network('URLs a probar', testUrls.length);
          Logger.network('Primeras 5 URLs', testUrls.slice(0, 5));
          
          const results = await Promise.allSettled(
            testUrls.map(url => this.testConnection(url))
          );
          
          const workingConnections = results
            .filter(result => result.status === 'fulfilled' && result.value.success)
            .map(result => result.value)
            .sort((a, b) => {
              // Priorizar HTTPS
              if (a.url.startsWith('https') && !b.url.startsWith('https')) return -1;
              if (!a.url.startsWith('https') && b.url.startsWith('https')) return 1;
              return 0;
            });
          
          Logger.network('Conexiones exitosas', workingConnections.length);
          
          if (workingConnections.length > 0) {
            const bestConnection = workingConnections[0];
            const config = {
              apiUrl: `${bestConnection.url}/api`,
              baseUrl: bestConnection.url,
              detectedIP: bestConnection.url.match(/(\d+\.\d+\.\d+\.\d+)/)?.[1] || 'localhost',
              detectionStatus: 'success',
              availableUrls: workingConnections.map(c => c.url),
              timestamp: new Date().toISOString(),
              protocol: bestConnection.url.startsWith('https') ? 'https' : 'http'
            };
            
            this.detectedConfig = config;
            Logger.network('Configuración detectada', config);
            localStorage.setItem('pestControlDetectedConfig', JSON.stringify(config));
            return config;
          } else {
            Logger.network('No se encontraron conexiones válidas');
            return this.getFallbackConfig();
          }
        } catch (error) {
          Logger.critical('Error en detección de red', error.message);
          return this.getFallbackConfig();
        } finally {
          this.isDetecting = false;
        }
      },

      getFallbackConfig() {
        // 🔧 ARREGLO: Usar el mismo protocolo que la página actual
        const currentProtocol = window.location.protocol;
        const protocol = currentProtocol === 'https:' ? 'https' : 'https'; // Siempre preferir HTTPS
        
        Logger.network('Fallback config usando protocolo', protocol);
        
        const config = {
          apiUrl: `${protocol}://drpestcontrol:8000/api`,
          baseUrl: `${protocol}://drpestcontrol:8000`,
          detectedIP: 'drpestcontrol',
          detectionStatus: 'fallback',
          availableUrls: [
            `${protocol}://drpestcontrol:8000`, 
            `${protocol}://localhost:8000`
          ],
          timestamp: new Date().toISOString(),
          protocol: protocol
        };
        
        this.detectedConfig = config;
        Logger.network('Config fallback creada', config);
        return config;
      },

      async getConfiguration() {
        const saved = localStorage.getItem('pestControlDetectedConfig');
        if (saved) {
          try {
            const config = JSON.parse(saved);
            
            // 🔧 VERIFICAR PROTOCOLO: Si la página cambió de HTTP a HTTPS, re-detectar
            const currentProtocol = window.location.protocol;
            const configProtocol = config.baseUrl.startsWith('https') ? 'https:' : 'http:';
            
            if (currentProtocol === 'https:' && configProtocol === 'http:') {
              Logger.network('Protocolo cambió a HTTPS, re-detectando...');
              return await this.detectConfiguration();
            }
            
            const test = await this.testConnection(config.baseUrl);
            if (test.success) {
              Logger.network('Usando configuración guardada', config);
              this.detectedConfig = config;
              return config;
            }
          } catch (error) {
            Logger.network('Configuración guardada inválida, re-detectando...', error.message);
          }
        }
        
        return await this.detectConfiguration();
      },

      async redetect() {
        localStorage.removeItem('pestControlDetectedConfig');
        this.detectedConfig = null;
        return await this.detectConfiguration();
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
